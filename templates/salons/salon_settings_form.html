{% extends 'base.html' %}

{% block title %}Configurações e Dados Fiscais do Salão — SPS{% endblock %}

{% block content %}
<section>
    <h2>Configurações Operacionais e Fiscais — {{ object.trade_name }}</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar Configurações</button>
    </form>
</section>
{% endblock %}

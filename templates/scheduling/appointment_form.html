{% extends "base.html" %}

{% block title %}Novo Agendamento — SPS{% endblock %}

{% block content %}
<section>
    <h2>Novo Agendamento (Múltiplos Serviços) — {{ request.salon.trade_name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Confirmar Agendamento</button>
        <a href="{% url 'scheduling:appointment_list' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
